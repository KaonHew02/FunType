<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FunType</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap">
<style>
/* ===================== FunType tokens ===================== */
:root{
  --bg:#16161e; --surface:#1e1e2a; --raise:#2b2b3c;
  --sub:#585a72; --sub-soft:#3a3b4d; --text:#e6e4f0;
  --accent:#ff9e64; --accent-deep:#b85f2b; --accent-ink:#231307;
  --error:#f7768e; --error-extra:#8c4257;
  --c-wpm:#d8792e; --c-raw:#6189e0; --c-err:#cf4a66;
  --font-ui:'Gabarito','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Cascadia Mono',ui-monospace,monospace;
  --fs-test:clamp(1.25rem,2.5vw,1.7rem);
  --r-s:8px; --r-m:12px;
  --ease:cubic-bezier(.2,.8,.25,1);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--sub);
  font-family:var(--font-ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background .35s var(--ease), color .35s var(--ease);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
::selection{background:var(--accent);color:var(--accent-ink)}

.app{
  max-width:1060px; margin:0 auto; min-height:100vh;
  padding:22px clamp(16px,4vw,32px) 18px;
  display:flex; flex-direction:column; gap:clamp(16px,3.2vh,32px);
}

/* ===================== brand ===================== */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:38px;height:38px;flex:none}
.k-skirt{fill:var(--accent-deep)}
.k-top{fill:var(--accent)}
.k-dish{fill:var(--accent-ink)}
.k-top,.k-bar{transition:transform .12s var(--ease)}
.brand:hover .k-top,.brand:hover .k-bar,.brand:active .k-top,.brand:active .k-bar{transform:translateY(2.6px)}
.k-bar{fill:var(--accent);animation:blink 1.05s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.1}}
.wordmark{font-size:1.5rem;font-weight:800;letter-spacing:-.022em;color:var(--accent);line-height:1}
.wordmark em{font-style:normal;color:var(--text)}

.records{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.rec{display:flex;flex-direction:column;gap:1px;padding:5px 11px;background:var(--surface);border-radius:var(--r-s);min-width:76px}
.rec b{font-family:var(--font-mono);font-size:.98rem;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.2}
.rec span{font-size:.65rem;letter-spacing:.09em;text-transform:uppercase;color:var(--sub)}
.rec.empty b{color:var(--sub-soft)}

/* ===================== command bar ===================== */
.bar{
  display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap;
  background:var(--surface);border-radius:var(--r-m);padding:7px 12px;align-self:center;
  font-family:var(--font-mono);font-size:.8rem;transition:opacity .2s var(--ease);
}
.bar.dim{opacity:0;pointer-events:none}
.grp{display:flex;gap:2px}
.bar button{padding:4px 9px;border-radius:var(--r-s);color:var(--sub);white-space:nowrap;transition:color .12s var(--ease)}
.bar button:hover{color:var(--text)}
.bar button[aria-pressed="true"]{color:var(--accent)}
.sep{width:1px;height:17px;background:var(--sub-soft);margin:0 8px;flex:none}

/* ===================== stage ===================== */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
.live{
  font-family:var(--font-mono);font-size:1.5rem;color:var(--accent);font-variant-numeric:tabular-nums;
  height:1.6em;display:flex;align-items:center;gap:18px;opacity:0;transition:opacity .2s var(--ease);
}
.live.on{opacity:1}
.live .muted{color:var(--sub);font-size:1rem}

.typing{
  position:relative;font-family:var(--font-mono);font-size:var(--fs-test);
  line-height:1.68;height:5.04em;overflow:hidden;cursor:text;
  transition:filter .18s var(--ease),opacity .18s var(--ease);
}
.typing.blurred{filter:blur(4.5px);opacity:.5}
.words{display:flex;flex-wrap:wrap;column-gap:.62em;position:relative;transition:transform .2s var(--ease);will-change:transform}
.word{position:relative;white-space:pre;color:var(--sub);border-bottom:2px solid transparent}
.word.bad{border-bottom-color:var(--error-extra)}
.c.ok{color:var(--text)}
.c.no{color:var(--error)}
.c.extra{color:var(--error-extra)}
.caret{
  position:absolute;left:0;top:0;width:3px;border-radius:2px;background:var(--accent);
  transition:transform .085s var(--ease),height .1s var(--ease);will-change:transform;
}
.caret.rest{animation:blink 1.05s steps(1,end) infinite}
.focusmsg{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-family:var(--font-ui);font-size:.95rem;color:var(--text);
}
.typing.blurred .focusmsg{display:flex}

.controls{display:flex;justify-content:center;gap:10px}
.ghost{padding:8px 18px;border-radius:var(--r-s);color:var(--sub);font-size:.85rem;transition:color .12s var(--ease),background .12s var(--ease)}
.ghost:hover{color:var(--text);background:var(--surface)}
.ghost.solid{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ghost.solid:hover{background:var(--text);color:var(--bg)}

/* ===================== results ===================== */
.results{display:grid;grid-template-columns:172px 1fr;gap:clamp(14px,3vw,28px);align-items:center}
.headline{display:flex;flex-direction:column;gap:12px}
.big{display:flex;flex-direction:column}
.big span{font-size:.69rem;letter-spacing:.11em;text-transform:uppercase;color:var(--sub)}
.big b{font-family:var(--font-mono);font-size:clamp(2.9rem,6.6vw,4rem);font-weight:500;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.big.sec b{font-size:clamp(1.9rem,4.2vw,2.5rem);color:var(--text)}
.pb{
  display:inline-flex;align-self:flex-start;background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;
}
.chartwrap{min-width:0}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.73rem;font-family:var(--font-mono);margin-top:4px}
.legend i{width:13px;height:3px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:6px}
.legend .x{width:auto;height:auto;color:var(--c-err);font-style:normal;font-weight:700;margin-right:5px}

.facts{grid-column:1/-1;display:flex;flex-wrap:wrap;border-top:1px solid var(--surface);padding-top:14px}
.fact{flex:1 1 126px;display:flex;flex-direction:column;gap:1px;padding:2px 14px 2px 0}
.fact span{font-size:.67rem;letter-spacing:.09em;text-transform:uppercase;color:var(--sub)}
.fact b{font-family:var(--font-mono);font-size:1.02rem;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.fact b small{font-size:.72em;color:var(--sub);font-weight:400}

/* ===================== footer ===================== */
.foot{display:flex;flex-direction:column;gap:13px;align-items:center;padding-top:4px}
.keys{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:.75rem;color:var(--sub)}
.keys kbd{font-family:var(--font-mono);font-size:.71rem;background:var(--surface);color:var(--text);padding:2px 7px;border-radius:5px;border-bottom:2px solid var(--raise);margin-right:5px}
.themes{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.swatch{width:22px;height:22px;border-radius:7px;border:2px solid transparent;display:grid;place-items:center;transition:transform .14s var(--ease),border-color .14s var(--ease)}
.swatch:hover{transform:translateY(-2px)}
.swatch[aria-pressed="true"]{border-color:var(--accent)}
.swatch i{width:9px;height:9px;border-radius:3px;display:block}
.sig{font-size:.71rem;color:var(--sub-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:680px){
  .results{grid-template-columns:1fr}
  .records{width:100%;margin-left:0}
  .sep{margin:0 3px}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>

<div class="app">

  <header class="top">
    <button class="brand" id="brand" title="FunType — restart">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <rect class="k-skirt" x="3" y="8" width="42" height="37" rx="11"/>
        <rect class="k-top" x="3" y="3" width="42" height="36" rx="11"/>
        <rect class="k-dish" x="9.5" y="8.5" width="29" height="25" rx="8"/>
        <rect class="k-bar" x="21.6" y="13" width="4.8" height="16" rx="2.4"/>
      </svg>
      <span class="wordmark">Fun<em>Type</em></span>
    </button>

    <div class="records" id="records"></div>
  </header>

  <section class="bar" id="cmdbar" aria-label="Test settings">
    <div class="grp">
      <button data-opt="punctuation" aria-pressed="false">! punctuation</button>
      <button data-opt="numbers" aria-pressed="false"># numbers</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button data-mode="time" aria-pressed="true">time</button>
      <button data-mode="words" aria-pressed="false">words</button>
      <button data-mode="text" aria-pressed="false">text</button>
      <button data-mode="code" aria-pressed="false">code</button>
    </div>
    <span class="sep"></span>
    <div class="grp" id="amounts"></div>
  </section>

  <main class="stage">
    <div id="testView">
      <div class="live" id="live" aria-live="off">
        <span id="liveLeft">30</span>
        <span class="muted" id="liveWpm"></span>
      </div>
      <div class="typing" id="typing">
        <div class="words" id="words"></div>
        <div class="focusmsg">click here or press any key to focus</div>
      </div>
      <div class="controls">
        <button class="ghost" id="restart">restart test</button>
      </div>
    </div>

    <div id="resultView" hidden></div>
  </main>

  <footer class="foot">
    <div class="keys">
      <span><kbd>tab</kbd>restart</span>
      <span><kbd>esc</kbd>new test</span>
      <span><kbd>ctrl</kbd>+<kbd>backspace</kbd>delete word</span>
    </div>
    <div class="themes" id="themes" role="group" aria-label="Theme"></div>
    <p class="sig">FunType — train the hands, the words follow.</p>
  </footer>
</div>

<input id="sink" class="sr" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Typing input" tabindex="-1">
<script>
(() => {
'use strict';

/* ============================================================
   FunType — content
   ============================================================ */

const WORDS = ('the be of and a to in he have it that for they with as not on she at by this we you do but from or which one would all will there say who make when can more if no man out other so what time up go about than into could state only new year some take come these know see use get like then first any work now may such give over think most even find day also after way many must look before great back through long where much should well people down own just because good each those feel seem how high too place little world very still hand old life tell write become here show house both between need mean call under last right move thing general school never same another begin while number part turn real leave might want point form off child few small since against ask late home large person end open public follow during present without again hold around possible head consider word program problem however lead system set eye plan run keep face fact group play stand early course change help line water build start night live power light case member start men name order small side told ever team high half hour late talk food room walk white door black next door book hard heart clear press young door money story sound water list mind story sure friend fall wait push carry watch stop learn reach voice grow speak happen serve wear near step among free field build teach rest quick cover across pull draw break sit send heavy simple trade bring share visit sleep drive catch worth answer enter middle strong drop ground return watch travel practice rhythm finger motion keyboard letter symbol accuracy repeat').split(' ');

const TEXTS = {
  short: [
    "Speed is the last thing to arrive. First comes the shape of the word under your fingers, then the rhythm that carries it, and only after those two settle does the count on the screen begin to climb.",
    "A good typist does not think in letters. They think in small familiar chunks, the way a musician reads a bar instead of a note, and the hands fill in the rest without being asked.",
    "Look at the word ahead, never the one you are typing. Your hands already know that one. The only useful place for your eyes is slightly in front of where your fingers currently are."
  ],
  medium: [
    "The fastest way to get slower is to chase a number. Accuracy sets the ceiling and speed only fills the room beneath it, so a run at ninety percent is worth less than a calm run at ninety eight. Slow down until the errors disappear, hold that pace for a week, and then let the speed come back on its own. It always does, and when it returns it stays, because the hands learned the motion cleanly the first time instead of learning a habit you would later have to unpick.",
    "Most people who practise typing practise the words they are already good at. That is pleasant and it teaches nothing. The letters that cost you time are the ones your weakest fingers own, the stretches across the top row, the punctuation you reach for without looking. Find the words that make you stumble, and give them more of your attention than the easy ones deserve. Your average will dip for a few days. Then it will move somewhere it has never been."
  ],
  long: [
    "There is a moment in learning to type when the whole thing quietly changes hands. For weeks you have been spelling, letter by letter, aware of each key as a separate destination, and then one afternoon a word arrives whole. You did not assemble it. Your fingers simply performed it, the way they perform a signature, and you were somewhere further down the sentence when it happened. After that the work is no longer about knowing where the keys are. It becomes about rhythm, about keeping an even pace when the words are unfamiliar, about not panicking when a mistake appears three characters back. The best runs feel oddly unhurried. Nothing is rushed, nothing is forced, and the number at the end is higher than it has any right to be. That is the feeling worth practising for, and it is available to anyone willing to be a little slower for a little while first."
  ]
};

const CODE = {
  js: [
    "const rows = data.filter(r => r.active && r.score > 0).map(r => ({ id: r.id, name: r.name.trim() }));",
    "export function debounce(fn, ms = 250) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }",
    "try { const res = await fetch(`/api/v1/users/${id}`, { headers: { 'Content-Type': 'application/json' } }); } catch (err) { console.error(err); }"
  ],
  py: [
    "def normalize(items, key='score'): total = sum(i[key] for i in items) or 1; return [{**i, key: i[key] / total} for i in items]",
    "with open(path, 'r', encoding='utf-8') as fh: rows = [line.strip().split('\\t') for line in fh if not line.startswith('#')]",
    "class Queue: def __init__(self, size: int = 16) -> None: self._buf = [None] * size; self._head = 0; self._tail = 0"
  ],
  sql: [
    "SELECT c.id, c.name, COUNT(o.id) AS orders FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id, c.name HAVING COUNT(o.id) > 3 ORDER BY orders DESC;",
    "UPDATE dbo.TBLMessage SET StatusCode = @status, UpdatedAt = GETDATE() WHERE MessageId = @id AND StatusCode <> 'DELETED';",
    "CREATE INDEX IX_msg_contact_created ON dbo.TBLMessage (ContactId ASC, CreatedAt DESC) INCLUDE (Body, Direction) WITH (ONLINE = ON);"
  ]
};

const THEMES = {
  dusk:      { label:'dusk',      bg:'#16161e', surface:'#1e1e2a', raise:'#2b2b3c', sub:'#585a72', subSoft:'#3a3b4d', text:'#e6e4f0', accent:'#ff9e64', accentDeep:'#b85f2b', accentInk:'#231307', error:'#f7768e', errorExtra:'#8c4257' },
  daylight:  { label:'daylight',  bg:'#eceef4', surface:'#f7f8fb', raise:'#dfe3ec', sub:'#8d95a8', subSoft:'#c3c9d6', text:'#1b1e27', accent:'#cf6a2c', accentDeep:'#9c4c1c', accentInk:'#fff6ef', error:'#c33552', errorExtra:'#e3a3af' },
  matcha:    { label:'matcha',    bg:'#1b2420', surface:'#24302b', raise:'#31423a', sub:'#5c7566', subSoft:'#3d5146', text:'#dfeae2', accent:'#9ccf5e', accentDeep:'#5d8a2f', accentInk:'#131a15', error:'#e07a6c', errorExtra:'#7d4139' },
  cobalt:    { label:'cobalt',    bg:'#0f1729', surface:'#17233d', raise:'#22314f', sub:'#4e6491', subSoft:'#2b3a5a', text:'#e2e9f7', accent:'#5ec8ff', accentDeep:'#2b7fad', accentInk:'#06131f', error:'#ff6b81', errorExtra:'#85374a' },
  nordfall:  { label:'nordfall',  bg:'#2e3440', surface:'#3b4252', raise:'#4a5366', sub:'#6b7891', subSoft:'#4c566a', text:'#e5e9f0', accent:'#88c0d0', accentDeep:'#5b8a99', accentInk:'#1b222c', error:'#bf616a', errorExtra:'#70383e' },
  bubblegum: { label:'bubblegum', bg:'#fdf0f3', surface:'#f7dde4', raise:'#efc7d3', sub:'#b98c9b', subSoft:'#dcb4c0', text:'#43303a', accent:'#e5527e', accentDeep:'#ad2f57', accentInk:'#fff3f6', error:'#b4213f', errorExtra:'#dd9aa8' },
  mono:      { label:'mono',      bg:'#0e0e10', surface:'#191919', raise:'#262626', sub:'#5c5c5c', subSoft:'#333333', text:'#ededed', accent:'#f5f5f5', accentDeep:'#8a8a8a', accentInk:'#0e0e10', error:'#d84c5a', errorExtra:'#6e2c33' },
  terminal:  { label:'terminal',  bg:'#050a05', surface:'#0d160d', raise:'#162416', sub:'#2f6b34', subSoft:'#1c3d1f', text:'#b7ffb7', accent:'#35ff4d', accentDeep:'#17a12a', accentInk:'#031003', error:'#ff4d4d', errorExtra:'#7d2020' }
};

/* Chart series — validated with the dataviz palette checker on both surfaces */
const SERIES = { wpm:'#d8792e', raw:'#6189e0', err:'#cf4a66' };

const AMOUNTS = {
  time:  [['15','15'],['30','30'],['60','60'],['120','120']],
  words: [['10','10'],['25','25'],['50','50'],['100','100']],
  text:  [['short','short'],['medium','medium'],['long','long']],
  code:  [['js','js'],['py','py'],['sql','sql']]
};

/* ============================================================
   state
   ============================================================ */

const LS = 'funtype.v1';
const S = {
  mode:'time', amount:{ time:'30', words:'25', text:'medium', code:'js' },
  punctuation:false, numbers:false, theme:'dusk',
  words:[], typed:[''], wordIndex:0,
  running:false, done:false, startTime:0, endTime:0,
  ks:{ ok:0, bad:0 }, samples:[], rawSteps:[],
  prevTyped:0, prevBad:0, ticker:null, rowStep:0, focused:true, idle:null
};
let BESTS = {}, TESTS = 0;

const $ = id => document.getElementById(id);
const el = { words:$('words'), typing:$('typing'), live:$('live'), liveLeft:$('liveLeft'),
  liveWpm:$('liveWpm'), bar:$('cmdbar'), amounts:$('amounts'), test:$('testView'),
  result:$('resultView'), records:$('records'), themes:$('themes'), sink:$('sink') };

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(LS) || '{}');
    if(d.mode && AMOUNTS[d.mode]) S.mode = d.mode;
    if(d.amount) Object.assign(S.amount, d.amount);
    S.punctuation = !!d.punctuation; S.numbers = !!d.numbers;
    if(d.theme && THEMES[d.theme]) S.theme = d.theme;
    BESTS = d.bests || {}; TESTS = d.tests || 0;
  }catch(e){ /* first run, or storage blocked */ }
}
function save(){
  try{
    localStorage.setItem(LS, JSON.stringify({ mode:S.mode, amount:S.amount,
      punctuation:S.punctuation, numbers:S.numbers, theme:S.theme, bests:BESTS, tests:TESTS }));
  }catch(e){ /* storage blocked — session still works */ }
}

/* ============================================================
   theme
   ============================================================ */

function applyTheme(){
  const t = THEMES[S.theme], r = document.documentElement.style;
  r.setProperty('--bg', t.bg); r.setProperty('--surface', t.surface);
  r.setProperty('--raise', t.raise); r.setProperty('--sub', t.sub);
  r.setProperty('--sub-soft', t.subSoft); r.setProperty('--text', t.text);
  r.setProperty('--accent', t.accent); r.setProperty('--accent-deep', t.accentDeep);
  r.setProperty('--accent-ink', t.accentInk); r.setProperty('--error', t.error);
  r.setProperty('--error-extra', t.errorExtra);
  [...el.themes.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === S.theme)));
}
function buildThemes(){
  el.themes.innerHTML = '';
  Object.entries(THEMES).forEach(([k,t]) => {
    const b = document.createElement('button');
    b.className = 'swatch'; b.dataset.theme = k; b.title = t.label;
    b.setAttribute('aria-label', 'Theme: ' + t.label); b.setAttribute('aria-pressed','false');
    b.style.background = t.surface;
    b.innerHTML = '<i style="background:' + t.accent + '"></i>';
    b.onclick = () => { S.theme = k; applyTheme(); save(); focusTest(); };
    el.themes.appendChild(b);
  });
}

/* ============================================================
   word generation
   ============================================================ */

const pick = a => a[Math.floor(Math.random() * a.length)];

function plainWords(n){
  const out = [];
  let last = '';
  while(out.length < n){ const w = pick(WORDS); if(w !== last){ out.push(w); last = w; } }
  return out;
}

function decorate(list){
  let capNext = S.punctuation;
  return list.map(w => {
    if(S.numbers && Math.random() < 0.11){
      const big = Math.random() < 0.4;
      return String(Math.floor(Math.random() * (big ? 10000 : 100)));
    }
    if(!S.punctuation) return w;
    let out = w;
    if(capNext){ out = out[0].toUpperCase() + out.slice(1); capNext = false; }
    const r = Math.random();
    if(r < 0.035) out = '"' + out + '"';
    else if(r < 0.06) out = '(' + out + ')';
    else if(r < 0.08) out = out + "'s";
    else if(r < 0.14) out += ',';
    else if(r < 0.21){ out += '.'; capNext = true; }
    else if(r < 0.23){ out += '?'; capNext = true; }
    else if(r < 0.25){ out += '!'; capNext = true; }
    else if(r < 0.265) out += ';';
    else if(r < 0.275) out += ':';
    return out;
  });
}

function buildWords(){
  if(S.mode === 'text') return pick(TEXTS[S.amount.text]).split(/\s+/);
  if(S.mode === 'code') return pick(CODE[S.amount.code]).split(/\s+/);
  if(S.mode === 'words') return decorate(plainWords(parseInt(S.amount.words, 10)));
  return decorate(plainWords(140));
}
function extendWords(){
  if(S.mode !== 'time') return;
  S.words = S.words.concat(decorate(plainWords(60)));
  renderWords(S.words.length - 60);
}

/* ============================================================
   rendering
   ============================================================ */

function wordNode(w){
  const d = document.createElement('div');
  d.className = 'word';
  for(const ch of w){
    const s = document.createElement('span');
    s.className = 'c'; s.textContent = ch; d.appendChild(s);
  }
  return d;
}

function renderWords(from){
  if(from === undefined || from === 0){
    el.words.innerHTML = '';
    const caret = document.createElement('div');
    caret.className = 'caret rest'; caret.id = 'caret';
    el.words.appendChild(caret);
    from = 0;
  }
  const frag = document.createDocumentFragment();
  for(let i = from; i < S.words.length; i++) frag.appendChild(wordNode(S.words[i]));
  el.words.appendChild(frag);
  S.rowStep = 0;
}
const wordEls = () => el.words.querySelectorAll('.word');

function rowStep(){
  if(S.rowStep) return S.rowStep;
  const ws = wordEls();
  const top0 = ws[0] ? ws[0].offsetTop : 0;
  for(const w of ws){ if(w.offsetTop > top0){ S.rowStep = w.offsetTop - top0; break; } }
  if(!S.rowStep) S.rowStep = ws[0] ? ws[0].offsetHeight : 40;
  return S.rowStep;
}

function paintWord(i){
  const node = wordEls()[i];
  if(!node) return;
  const target = S.words[i], typed = S.typed[i] || '';
  const spans = node.querySelectorAll('.c');
  spans.forEach((s, j) => {
    if(j >= target.length) return;
    s.className = 'c' + (j >= typed.length ? '' : (typed[j] === target[j] ? ' ok' : ' no'));
  });
  // extra characters typed past the end of the word
  const wanted = Math.max(0, typed.length - target.length);
  let extras = node.querySelectorAll('.c.extra').length;
  while(extras > wanted){ node.removeChild(node.lastChild); extras--; }
  while(extras < wanted){
    const s = document.createElement('span');
    s.className = 'c extra'; s.textContent = typed[target.length + extras];
    node.appendChild(s); extras++;
  }
  node.classList.toggle('bad', i < S.wordIndex && typed !== target);
}

function moveCaret(){
  const caret = $('caret'), node = wordEls()[S.wordIndex];
  if(!caret || !node) return;
  const typed = S.typed[S.wordIndex] || '';
  const spans = node.querySelectorAll('.c');
  let x = node.offsetLeft;
  if(typed.length > 0 && spans.length){
    const s = spans[Math.min(typed.length, spans.length) - 1];
    x += s.offsetLeft + s.offsetWidth;
  }
  const h = node.offsetHeight;
  caret.style.height = Math.round(h * 0.74) + 'px';
  caret.style.transform = 'translate(' + x + 'px,' + (node.offsetTop + h * 0.13) + 'px)';
  caret.classList.toggle('rest', typed.length === 0 && !S.running);
  scrollLines(node);
}

function scrollLines(node){
  const step = rowStep();
  const line = Math.round(node.offsetTop / step);
  const offset = Math.max(0, (line - 1) * step);
  el.words.style.transform = 'translateY(' + (-offset) + 'px)';
}

/* ============================================================
   typing
   ============================================================ */

function typeChar(ch){
  if(S.done) return;
  if(!S.running) startTest();
  const i = S.wordIndex, target = S.words[i] || '';
  const typed = S.typed[i] || '';
  if(typed.length >= target.length + 12) return;   // cap runaway extras
  if(typed.length < target.length && ch === target[typed.length]) S.ks.ok++; else S.ks.bad++;
  S.typed[i] = typed + ch;
  paintWord(i); moveCaret();
}

function commitWord(){
  if(S.done || !S.running) return;
  const i = S.wordIndex;
  if((S.typed[i] || '').length === 0) return;      // no leading / double spaces
  if(S.typed[i] === S.words[i]) S.ks.ok++; else S.ks.bad++;
  paintWord(i);
  S.wordIndex++;
  if(S.typed[S.wordIndex] === undefined) S.typed[S.wordIndex] = '';
  if(S.mode === 'time' && S.wordIndex > S.words.length - 30) extendWords();
  if(S.mode !== 'time' && S.wordIndex >= S.words.length){ finish(); return; }
  moveCaret();
}

function backspace(whole){
  if(S.done) return;
  let i = S.wordIndex;
  if((S.typed[i] || '').length === 0){
    // step back only into a word that was left imperfect
    if(i === 0) return;
    if(S.typed[i - 1] === S.words[i - 1]) return;
    S.wordIndex = --i;
    wordEls()[i].classList.remove('bad');
  }
  S.typed[i] = whole ? '' : S.typed[i].slice(0, -1);
  paintWord(i); moveCaret();
}

/* ============================================================
   clock + scoring
   ============================================================ */

function tally(){
  let correct = 0, incorrect = 0, extra = 0, missed = 0, allTyped = 0;
  for(let i = 0; i <= S.wordIndex; i++){
    const t = S.typed[i] || '', w = S.words[i] || '';
    allTyped += t.length;
    const len = Math.max(t.length, w.length);
    for(let j = 0; j < len; j++){
      if(t[j] === undefined){ if(i < S.wordIndex) missed++; }
      else if(w[j] === undefined) extra++;
      else if(t[j] === w[j]) correct++;
      else incorrect++;
    }
    if(i < S.wordIndex){ allTyped++; if(t === w) correct++; else incorrect++; }
  }
  return { correct, incorrect, extra, missed, allTyped };
}

const minutes = () => Math.max(((S.done ? S.endTime : Date.now()) - S.startTime) / 60000, 1 / 600);
const wpmNow = () => { const t = tally(); return (t.correct / 5) / minutes(); };

function startTest(){
  S.running = true; S.startTime = Date.now();
  S.samples = []; S.rawSteps = []; S.prevTyped = 0; S.prevBad = 0;
  el.live.classList.add('on'); el.bar.classList.add('dim');
  S.ticker = setInterval(tick, 1000);
  paintLive();
}

function tick(){
  const t = tally();
  const elapsed = Math.round((Date.now() - S.startTime) / 1000);
  const step = (t.allTyped - S.prevTyped) * 12;          // chars this second → wpm
  S.rawSteps.push(step);
  S.samples.push({
    t: elapsed,
    wpm: (t.correct / 5) / (elapsed / 60 || 1 / 60),
    raw: (t.allTyped / 5) / (elapsed / 60 || 1 / 60),
    err: S.ks.bad - S.prevBad
  });
  S.prevTyped = t.allTyped; S.prevBad = S.ks.bad;
  paintLive();
  if(S.mode === 'time' && elapsed >= parseInt(S.amount.time, 10)) finish();
}

function paintLive(){
  if(S.mode === 'time'){
    const total = parseInt(S.amount.time, 10);
    const left = S.running ? total - Math.round((Date.now() - S.startTime) / 1000) : total;
    el.liveLeft.textContent = Math.max(0, left);
  } else {
    el.liveLeft.textContent = S.wordIndex + '/' + S.words.length;
  }
  el.liveWpm.textContent = S.running ? Math.round(wpmNow()) + ' wpm' : '';
}

function consistency(){
  const v = S.rawSteps.filter((x, i) => i < S.rawSteps.length);
  if(v.length < 2) return 100;
  const mean = v.reduce((a, b) => a + b, 0) / v.length;
  if(mean <= 0) return 0;
  const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / v.length);
  return Math.max(0, Math.min(100, 100 * (1 - sd / mean)));
}

function finish(){
  if(S.done) return;
  S.done = true; S.running = false; S.endTime = Date.now();
  clearInterval(S.ticker);
  el.live.classList.remove('on'); el.bar.classList.remove('dim');
  if(!S.samples.length) tick();
  showResults();
}

/* ============================================================
   results
   ============================================================ */

const modeKey = () => S.mode + '-' + S.amount[S.mode] +
  (S.punctuation ? '-p' : '') + (S.numbers ? '-n' : '');
const modeLabel = () => S.mode + ' ' + S.amount[S.mode] +
  (S.punctuation ? ' · punctuation' : '') + (S.numbers ? ' · numbers' : '');

function showResults(){
  const t = tally();
  const secs = (S.endTime - S.startTime) / 1000;
  const wpm = Math.round((t.correct / 5) / (secs / 60));
  const raw = Math.round((t.allTyped / 5) / (secs / 60));
  const acc = S.ks.ok + S.ks.bad ? Math.round((S.ks.ok / (S.ks.ok + S.ks.bad)) * 100) : 100;
  const con = Math.round(consistency());

  const key = modeKey(), prev = BESTS[key];
  const isPB = !prev || wpm > prev.wpm;
  if(isPB && isFinite(wpm)) BESTS[key] = { wpm, acc, at: Date.now() };
  TESTS++; save(); renderRecords();

  el.result.innerHTML =
    '<div class="results">' +
      '<div class="headline">' +
        (isPB && prev ? '<span class="pb">new best · +' + (wpm - prev.wpm) + '</span>' :
         isPB ? '<span class="pb">first record</span>' : '') +
        '<div class="big"><span>wpm</span><b>' + wpm + '</b></div>' +
        '<div class="big sec"><span>accuracy</span><b>' + acc + '%</b></div>' +
      '</div>' +
      '<div class="chartwrap">' + chartSVG() +
        '<div class="legend">' +
          '<span><i style="background:' + SERIES.wpm + '"></i>net wpm</span>' +
          '<span><i style="background:' + SERIES.raw + '"></i>raw wpm</span>' +
          '<span><i class="x">&#10005;</i>errors</span>' +
        '</div>' +
      '</div>' +
      '<div class="facts">' +
        fact('test', modeLabel()) +
        fact('raw', raw + ' <small>wpm</small>') +
        fact('consistency', con + '%') +
        fact('characters', t.correct + '<small>/' + t.incorrect + '/' + t.extra + '/' + t.missed + '</small>') +
        fact('time', secs.toFixed(1) + '<small>s</small>') +
        fact('personal best', (BESTS[key] ? BESTS[key].wpm : wpm) + ' <small>wpm</small>') +
      '</div>' +
    '</div>' +
    '<div class="controls" style="margin-top:22px">' +
      '<button class="ghost solid" id="again">next test</button>' +
      '<button class="ghost" id="repeat">repeat this text</button>' +
    '</div>';

  el.test.hidden = true; el.result.hidden = false;
  $('again').onclick = () => newTest();
  $('repeat').onclick = () => newTest(true);
}
const fact = (label, val) => '<div class="fact"><span>' + label + '</span><b>' + val + '</b></div>';

/* ------------------------- chart ------------------------- */

function niceMax(v){
  const steps = [20, 25, 40, 50, 60, 80, 100, 120, 150, 200, 250, 300];
  for(const s of steps) if(v <= s) return s;
  return Math.ceil(v / 50) * 50;
}

function chartSVG(){
  const d = S.samples.filter(s => isFinite(s.wpm) && isFinite(s.raw));
  if(d.length < 2){
    return '<p style="font-family:var(--font-mono);font-size:.8rem;color:var(--sub);margin:0;padding:26px 0">' +
      'too short to chart — run 15 seconds or more to see the pace curve</p>';
  }
  const W = 560, H = 186, L = 34, R = 52, T = 14, B = 26;
  const top = niceMax(Math.max(...d.map(s => Math.max(s.wpm, s.raw))));
  const X = i => L + (i / (d.length - 1)) * (W - L - R);
  const Y = v => T + (1 - v / top) * (H - T - B);
  const path = k => d.map((s, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(s[k]).toFixed(1)).join(' ');

  let g = '';
  [0, top / 2, top].forEach(v => {
    g += '<line x1="' + L + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - R) + '" y2="' + Y(v).toFixed(1) +
      '" stroke="var(--surface)" stroke-width="1"/>' +
      '<text x="' + (L - 8) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end" class="ct">' + Math.round(v) + '</text>';
  });
  [0, Math.floor((d.length - 1) / 2), d.length - 1].forEach(i => {
    g += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" class="ct">' + d[i].t + 's</text>';
  });

  const area = 'M' + X(0).toFixed(1) + ' ' + Y(0).toFixed(1) + ' ' + path('wpm').slice(1) +
    ' L' + X(d.length - 1).toFixed(1) + ' ' + Y(0).toFixed(1) + ' Z';

  const marks = d.map((s, i) => s.err > 0
    ? '<text x="' + X(i).toFixed(1) + '" y="' + (Y(s.raw) + 4).toFixed(1) + '" text-anchor="middle" ' +
      'fill="' + SERIES.err + '" font-size="11" font-weight="700">&#10005;</text>' : '').join('');

  const last = d[d.length - 1];
  let yw = Y(last.wpm), yr = Y(last.raw);
  if(Math.abs(yw - yr) < 13){ if(yw <= yr){ yw -= 6; yr += 7; } else { yw += 7; yr -= 6; } }

  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
    'aria-label="Words per minute over the run: net ' + Math.round(last.wpm) +
    ', raw ' + Math.round(last.raw) + '" preserveAspectRatio="xMidYMid meet">' +
    '<style>.ct{fill:var(--sub);font-family:var(--font-mono);font-size:10px}' +
    '.cl{font-family:var(--font-mono);font-size:10.5px;font-weight:600}</style>' +
    g +
    '<path d="' + area + '" fill="' + SERIES.wpm + '" opacity="0.13"/>' +
    '<path d="' + path('raw') + '" fill="none" stroke="' + SERIES.raw + '" stroke-width="2" ' +
      'stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>' +
    '<path d="' + path('wpm') + '" fill="none" stroke="' + SERIES.wpm + '" stroke-width="2.5" ' +
      'stroke-linejoin="round" stroke-linecap="round"/>' +
    marks +
    '<circle cx="' + X(d.length - 1).toFixed(1) + '" cy="' + Y(last.wpm).toFixed(1) + '" r="3.5" ' +
      'fill="' + SERIES.wpm + '" stroke="var(--bg)" stroke-width="2"/>' +
    '<text x="' + (W - R + 8) + '" y="' + (yw + 3.5).toFixed(1) + '" class="cl" fill="' + SERIES.wpm + '">net</text>' +
    '<text x="' + (W - R + 8) + '" y="' + (yr + 3.5).toFixed(1) + '" class="cl" fill="' + SERIES.raw + '">raw</text>' +
    '</svg>';
}

/* ------------------------- records ------------------------- */

function renderRecords(){
  const mine = BESTS[modeKey()];
  const all = Object.values(BESTS).reduce((m, b) => (!m || b.wpm > m.wpm) ? b : m, null);
  el.records.innerHTML =
    chip(mine ? mine.wpm : '—', 'best · ' + S.mode + ' ' + S.amount[S.mode], !mine) +
    chip(all ? all.wpm : '—', 'all-time best', !all) +
    chip(TESTS || '—', 'tests run', !TESTS);
}
const chip = (v, label, empty) =>
  '<div class="rec' + (empty ? ' empty' : '') + '"><b>' + v + '</b><span>' + label + '</span></div>';

/* ============================================================
   lifecycle
   ============================================================ */

function newTest(keepText){
  clearInterval(S.ticker);
  if(!keepText || !S.words.length) S.words = buildWords();
  S.typed = ['']; S.wordIndex = 0; S.running = false; S.done = false;
  S.ks = { ok:0, bad:0 }; S.samples = []; S.rawSteps = [];
  el.result.hidden = true; el.test.hidden = false;
  el.bar.classList.remove('dim'); el.live.classList.remove('on');
  el.words.style.transform = 'translateY(0)';
  renderWords(0); renderRecords(); paintLive();
  requestAnimationFrame(moveCaret);
  focusTest();
}

function focusTest(){
  S.focused = true;
  el.typing.classList.remove('blurred');
  try{ el.sink.value = ' '; el.sink.focus({ preventScroll:true }); }catch(e){}
  resetIdle();
}
function resetIdle(){
  clearTimeout(S.idle);
  if(!S.running) return;
  S.idle = setTimeout(() => { S.focused = false; el.typing.classList.add('blurred'); }, 8000);
}

function buildAmounts(){
  el.amounts.innerHTML = '';
  AMOUNTS[S.mode].forEach(([val, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.setAttribute('aria-pressed', String(S.amount[S.mode] === val));
    b.onclick = () => { S.amount[S.mode] = val; save(); buildAmounts(); newTest(); };
    el.amounts.appendChild(b);
  });
}

function bindBar(){
  el.bar.querySelectorAll('[data-mode]').forEach(b => {
    b.onclick = () => {
      S.mode = b.dataset.mode; save();
      el.bar.querySelectorAll('[data-mode]').forEach(x =>
        x.setAttribute('aria-pressed', String(x.dataset.mode === S.mode)));
      buildAmounts(); newTest();
    };
  });
  el.bar.querySelectorAll('[data-opt]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.opt; S[k] = !S[k];
      b.setAttribute('aria-pressed', String(S[k])); save(); newTest();
    };
  });
}

/* ------------------------- input ------------------------- */

document.addEventListener('keydown', e => {
  if(e.key === 'Tab' && !e.shiftKey){ e.preventDefault(); newTest(true); return; }
  if(e.key === 'Escape'){ e.preventDefault(); newTest(); return; }
  if(e.ctrlKey || e.metaKey || e.altKey){
    if(e.key === 'Backspace'){ e.preventDefault(); focusTest(); backspace(true); resetIdle(); }
    return;
  }
  if(!el.result.hidden){
    if(e.key === 'Enter'){ e.preventDefault(); newTest(); }
    return;
  }
  if(e.key === 'Backspace'){ e.preventDefault(); focusTest(); backspace(false); resetIdle(); return; }
  if(e.key === ' '){ e.preventDefault(); focusTest(); commitWord(); resetIdle(); return; }
  if(e.key.length === 1){ e.preventDefault(); focusTest(); typeChar(e.key); resetIdle(); }
});

/* mobile / IME keyboards report key="Unidentified", so mirror the sink's value */
el.sink.addEventListener('input', () => {
  const v = el.sink.value;
  if(!el.result.hidden){ el.sink.value = ' '; return; }
  if(v.length === 0){ backspace(false); }
  else if(v.length > 1){
    for(const ch of v.slice(1)){ if(ch === ' ') commitWord(); else typeChar(ch); }
  }
  el.sink.value = ' ';
  resetIdle();
});

el.typing.addEventListener('mousedown', e => { e.preventDefault(); focusTest(); });
$('restart').onclick = () => newTest();
$('brand').onclick = () => newTest();
window.addEventListener('resize', () => { S.rowStep = 0; moveCaret(); });
document.fonts && document.fonts.ready.then(() => { S.rowStep = 0; moveCaret(); });

/* ------------------------- go ------------------------- */

load();
buildThemes(); applyTheme(); bindBar();
el.bar.querySelectorAll('[data-mode]').forEach(x =>
  x.setAttribute('aria-pressed', String(x.dataset.mode === S.mode)));
el.bar.querySelectorAll('[data-opt]').forEach(b =>
  b.setAttribute('aria-pressed', String(S[b.dataset.opt])));
buildAmounts();
newTest();

})();
</script>

</body>
</html>
